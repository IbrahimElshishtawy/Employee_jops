name: Flutter Web Deployment to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: employee_setup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Employee_jops/"

      - name: Verify Flutter Web artifact
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -d build/web/assets
          echo "Flutter Web artifact verified successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: employee_setup/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4