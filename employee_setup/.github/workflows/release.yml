name: Release Build & GitHub Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_and_build:
    name: Validate, Test & Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Extract Tag & Version
        id: version_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          fi
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## What's New in ${{ steps.version_info.outputs.tag_name }}

          - Enterprise Attendance & Smart GPS Validation
          - Operational Department Requests & Workflow
          - Team Communications & Instant Direct Messaging
          - Biometric Security & Push Notification Enhancements
          - Performance Improvements & Stability Fixes

          ## Release Type
          **Type 1 — Normal Native / Store Release**

          ## Version Details
          - **Version:** `${{ steps.version_info.outputs.version }}`
          - **Build Artifacts:** APK (Universal), AAB (Play Store ready)

          ---
          *For Dart-only bug fixes after store release, OTA updates can be delivered via Shorebird Code Push.*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: Release ${{ steps.version_info.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.is_prerelease || false }}
          draft: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Update Notification (FCM / Webhook)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "Sending FCM update notification to active devices for version ${{ steps.version_info.outputs.version }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
